name: Feature request
description: Propose a bounded, verifiable product improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the decision or workflow problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Intended users and context
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Verifiable outcome
      description: How would we know the change works without inventing business impact?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy, safety, cost, or rights considerations
    validations:
      required: true
